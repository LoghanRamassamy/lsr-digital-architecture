name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check code formatting
        run: pnpm format:check

      - name: Build production bundle
        run: pnpm build

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/344658308078/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@lsr-digital-architecture.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy preview to Firebase Hosting (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes firebase-tools hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --project lsr-digital-architecture --expires 7d
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy to Firebase Hosting (Live)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx --yes firebase-tools deploy --only hosting --project lsr-digital-architecture --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
